# Build and deploy the Events Portal to Cloud Run.
#
# Every configuration value — including the three NEXT_PUBLIC_* ones — is read
# from Secret Manager rather than passed in. That is what lets the GitHub
# Actions workflow be a five-line file with no repository secrets in it: it
# authenticates by Workload Identity Federation and calls this config, which
# then fetches everything it needs itself.
#
# The NEXT_PUBLIC_* values are not secret (Next inlines them into the client
# bundle), but they still have to be *build arguments* rather than Cloud Run
# environment variables, because that inlining happens at build time. Keeping
# them alongside the real secrets means there is exactly one place to change a
# value.

substitutions:
  _REGION: asia-southeast1
  _SERVICE: pp-events
  _REPO: events-portal

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/DIRECT_URL/versions/latest
      env: DIRECT_URL
    - versionName: projects/$PROJECT_ID/secrets/JWT_SECRET/versions/latest
      env: JWT_SECRET
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest
      env: NEXT_PUBLIC_SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/latest
      env: NEXT_PUBLIC_SUPABASE_ANON_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_BASE_URL/versions/latest
      env: NEXT_PUBLIC_BASE_URL

steps:
  # Build. Tagged with the commit SHA so every revision is traceable back to a
  # commit, and with `latest` so a manual deploy has an obvious handle.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - DATABASE_URL
      - DIRECT_URL
      - JWT_SECRET
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - NEXT_PUBLIC_BASE_URL
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        docker build \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          --build-arg DIRECT_URL="$$DIRECT_URL" \
          --build-arg JWT_SECRET="$$JWT_SECRET" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$$NEXT_PUBLIC_SUPABASE_URL" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          --build-arg NEXT_PUBLIC_BASE_URL="$$NEXT_PUBLIC_BASE_URL" \
          --build-arg NODE_ENV=production \
          -t "$$IMAGE:$SHORT_SHA" \
          -t "$$IMAGE:latest" \
          .

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        docker push "$$IMAGE:$SHORT_SHA"
        docker push "$$IMAGE:latest"

  # Deploy. The secrets are mounted as environment variables from Secret
  # Manager rather than being set as plaintext service config.
  #
  # Sized for a personal project that still has to survive a hall full of
  # phones on draw day:
  #   min-instances 0   scale to zero — nothing runs, nothing is billed, between
  #                     events. This is the setting that keeps the bill at ~$0.
  #   max-instances 5   a ceiling on the damage a runaway loop or a crawler can
  #                     do to the bill.
  #   concurrency 250   the live page holds one long SSE connection per viewer,
  #                     and those are nearly idle. Packing many onto an instance
  #                     is what stops 200 phones from spinning up 200 instances
  #                     — and it cuts database load too, since live-hub runs one
  #                     poller per draw *per instance*.
  #   cpu-throttling    CPU is billed only while a request is in flight. An open
  #                     SSE stream counts as in-flight, so the draw still works.
  #   timeout 3600      the SSE stream is a long-lived request; the default 5
  #                     minutes would cut viewers off mid-event and make them
  #                     reconnect.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv:
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - NEXT_PUBLIC_BASE_URL
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        gcloud run deploy "${_SERVICE}" \
          --image "$$IMAGE:$SHORT_SHA" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --memory 1Gi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 5 \
          --concurrency 250 \
          --cpu-throttling \
          --timeout 3600 \
          --set-env-vars "NODE_ENV=production,NEXT_PUBLIC_BASE_URL=$$NEXT_PUBLIC_BASE_URL,NEXT_PUBLIC_SUPABASE_URL=$$NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY=$$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          --set-secrets "DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_SECRET=JWT_SECRET:latest"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
